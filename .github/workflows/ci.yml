name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner has no Deadlock install, so the live-layout comparison is the
      # one check that skips; the gate prints it as a skip, never as a pass. The
      # unit tests, the fake-Panorama harness and the shipped-data checks all run,
      # and the recorded analytics fixture is in the repository so WPA is
      # recomputed without the network.
      - name: gate
        run: python tools/gate.py --skip-live

      # The archive is built on a Windows machine with the CSDK resource compiler
      # and Source2Viewer CLI (python tools/build_addon.py) and committed, because
      # retail Panorama loads only compiled assets and neither tool exists on the
      # runner. CI verifies the committed bytes instead of packing raw sources: a
      # hand-packed archive of `.xml`/`.js`/`.css` mounts and renders nothing.
      - name: verify the committed archive
        run: python tools/verify_vpk.py dist/soul_lens/pak01_dir.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: soul-lens-vpk
          path: dist/soul_lens/pak01_dir.vpk
          if-no-files-found: error

  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify the committed archive
        run: python tools/verify_vpk.py dist/soul_lens/pak01_dir.vpk
      - name: publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="The Soul Lens passive section: a native-styled header and one sentence, then six stat tiles for weapon power, WPA, standing DPS, measured buy time, shop-list place and Statlocker rank. The tiles follow the card's own row: two across when four terms are visible, three across when all six are. A source that does not answer keeps its tile and says so instead of disappearing. Install: copy pak01_dir.vpk to game/citadel/addons/soul_lens/ and add 'game citadel/addons/soul_lens' to SearchPaths in gameinfo.gi, or run install.ps1 from the repository."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/soul_lens/pak01_dir.vpk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/soul_lens/pak01_dir.vpk \
              --title "Soul Lens $GITHUB_REF_NAME" --notes "$notes"
          fi
